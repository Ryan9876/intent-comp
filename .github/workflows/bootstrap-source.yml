name: bootstrap-source

on:
  push:
    branches:
      - agent/publish-intent-compiler-v0.4.0

permissions:
  contents: write

jobs:
  expand-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand validated source archive
        run: |
          tar -xzf release/intent-compiler-v0.4.0-source.tar.gz -C .
          rm -f release/intent-compiler-v0.4.0-source.tar.gz
          rmdir release 2>/dev/null || true
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Intent Compiler v0.4.0 source"
          git push
