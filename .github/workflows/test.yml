name: test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-source:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/publish-intent-compiler-v0.4.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Expand source archive on branch
        shell: bash
        run: |
          if [ -f release/intent-compiler-v0.4.0-source.tar.gz ]; then
            tar -xzf release/intent-compiler-v0.4.0-source.tar.gz -C .
            rm -f release/intent-compiler-v0.4.0-source.tar.gz
            rmdir release 2>/dev/null || true
            rm -f .github/workflows/bootstrap-source.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand Intent Compiler v0.4.0 source"
            git push origin HEAD:${{ github.head_ref }}
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Expand source for validation
        shell: bash
        run: |
          if [ -f release/intent-compiler-v0.4.0-source.tar.gz ]; then
            tar -xzf release/intent-compiler-v0.4.0-source.tar.gz -C .
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
