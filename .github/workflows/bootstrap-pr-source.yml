name: bootstrap-pr-source

on:
  pull_request:
    branches:
      - main
    paths:
      - release/BOOTSTRAP_READY

permissions:
  contents: write

jobs:
  expand-validate-publish:
    if: ${{ github.head_ref == 'agent/publish-intent-compiler-v0.4.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          test -f release/BOOTSTRAP_READY
          test -d release/source-chunks
          cat release/source-chunks/part-* > /tmp/intent-compiler-source.b64
          echo "b34ef079ed453f7f45fd5defe381ba6406d8e15253b2d41e1e07fe75d939f395  /tmp/intent-compiler-source.b64" | sha256sum -c -
          base64 --decode /tmp/intent-compiler-source.b64 > /tmp/intent-compiler-source.tar.gz
          echo "a56879f0e5e35918a49d8520b323f2bc8902dce643b255f4c89b2730589d730d  /tmp/intent-compiler-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/intent-compiler-source.tar.gz -C .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test expanded source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest

      - name: Commit expanded source to publication branch
        shell: bash
        run: |
          rm -rf release
          rm -f BOOTSTRAP_TRIGGER.md BOOTSTRAP_TRIGGER_2.md
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Intent Compiler v0.4.0 source"
          git push origin HEAD:${{ github.head_ref }}
